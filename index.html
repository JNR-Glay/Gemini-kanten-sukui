<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>あんみつすくい！ 〜寒天 vs 謎豆〜</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        :root {
            --bg-color: #f7f0e6;
            --primary: #c2410c;
            --panel-bg: #fffbf7;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        /* ヘッダー UI */
        .header-ui {
            width: 100%;
            background: var(--panel-bg);
            border: 3px solid #7c2d12;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .ui-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ui-label {
            font-size: 11px;
            font-weight: bold;
            color: #9a3412;
            margin-bottom: 2px;
        }

        .ui-value {
            font-size: 24px;
            font-weight: 900;
            color: #431407;
        }

        #timer.warning {
            color: #dc2626;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* メイン キャンバス */
        #canvas-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            margin: auto 0;
        }

        canvas {
            background: transparent;
            border-radius: 50%;
        }

        /* コントロールエリア */
        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
            z-index: 10;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #ea580c;
            border: none;
            border-bottom: 4px solid #9a3412;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-align: center;
        }

        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-secondary {
            background: #78350f;
            border-bottom-color: #451a03;
        }

        /* モーダル表示 */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(67, 20, 7, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            border-radius: 16px;
            color: #fff;
            text-align: center;
        }

        .modal.hidden {
            display: none;
        }

        .modal h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #fde047;
            text-shadow: 2px 2px 0 #7c2d12;
        }

        .modal p {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
            color: #ffedd5;
        }

        .rank-badge {
            font-size: 22px;
            font-weight: bold;
            color: #fde047;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 10px 0;
            border: 2px solid #fde047;
        }

        .new-record {
            color: #ef4444;
            font-size: 16px;
            font-weight: bold;
            animation: bounce 0.6s infinite alternate;
            margin-top: 4px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }

        /* 獲得浮遊エフェクト */
        .score-float {
            position: absolute;
            font-weight: 900;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        /* 称号リスト */
        .rank-list {
            font-size: 11px;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 280px;
        }
        .rank-list div {
            margin: 2px 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- UI Header -->
    <div class="header-ui">
        <div class="ui-box">
            <span class="ui-label">SCORE</span>
            <span id="score" class="ui-value">0</span>
        </div>
        <div class="ui-box">
            <span class="ui-label">TIME</span>
            <span id="timer" class="ui-value">60</span>
        </div>
        <div class="ui-box">
            <span class="ui-label">BEST</span>
            <span id="best-score" class="ui-value">0</span>
        </div>
    </div>

    <!-- Canvas Wrapper -->
    <div id="canvas-wrapper"></div>

    <!-- Controls -->
    <div class="controls">
        <button id="mix-btn" class="btn btn-secondary">🥣 お皿を混ぜる</button>
    </div>

    <!-- Start Modal -->
    <div id="start-modal" class="modal">
        <h1>あんみつすくい！</h1>
        <p>寒天と豆をすくって極上あんみつを作ろう！<br><br>
        <strong>【操作】</strong><br>
        ・タップ：静かに狙いすくい<br>
        ・スライド：具材を押し分けてすくう<br>
        ・<strong>指を離すとすくい揚げ（獲得）！</strong>
        </p>
        
        <div class="rank-list">
            <div>🏆 寒天神: 200点以上</div>
            <div>🥇 寒天マスター: 150〜199点</div>
            <div>🥈 寒天の選別士: 100〜149点</div>
            <div>🥉 あんみつ愛好家: 50〜99点</div>
            <div>🫘 豆クラッシャー: 0〜49点</div>
        </div>

        <button id="start-btn" class="btn" style="width: 200px;">ゲームスタート</button>
    </div>

    <!-- Game Over Modal -->
    <div id="result-modal" class="modal hidden">
        <h1 style="color: #fff;">タイムアップ！</h1>
        <p>最終スコア</p>
        <div id="final-score" style="font-size: 40px; font-weight: 900; color: #fde047;">0</div>
        <div id="new-record-msg" class="new-record hidden">🎉 BEST RECORD! 🎉</div>
        <div id="rank-badge" class="rank-badge">称号: 寒天初心者</div>
        <button id="restart-btn" class="btn" style="width: 200px; margin-top: 15px;">もう一度遊ぶ</button>
    </div>
</div>

<script>
(() => {
    const { Engine, Render, Runner, Bodies, Composite, Body, Vector, Events } = Matter;

    // ゲーム定数・設定
    const CANVAS_SIZE = 360;
    const RADIUS = CANVAS_SIZE / 2;
    const SPOON_RADIUS = 36; // スプーン範囲
    
    // スコア定数
    const SCORE_KANTEN = 1;
    const SCORE_MAME = -1;
    const SCORE_GYUHYU = 2;

    // ゲーム状態
    let engine, render, runner;
    let score = 0;
    let timeLeft = 60;
    let gameTimer = null;
    let isPlaying = false;
    let bestScore = parseInt(localStorage.getItem('anmitsu_best') || '0', 10);
    
    let spoonBody = null;
    let items = [];
    let gyuhyuUnlocked = false;

    // ドラッグ・タップ判定用
    let isMouseDown = false;
    let startPos = { x: 0, y: 0 };
    let currentPos = { x: 0, y: 0 };
    let isSliding = false;

    // UI Elements
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const bestScoreEl = document.getElementById('best-score');
    const startModal = document.getElementById('start-modal');
    const resultModal = document.getElementById('result-modal');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const mixBtn = document.getElementById('mix-btn');
    const finalScoreEl = document.getElementById('final-score');
    const rankBadgeEl = document.getElementById('rank-badge');
    const newRecordMsg = document.getElementById('new-record-msg');
    const wrapper = document.getElementById('canvas-wrapper');

    bestScoreEl.textContent = bestScore;

    // 初期化
    function initEngine() {
        engine = Engine.create({
            gravity: { x: 0, y: 0.8 } // 緩やかな重力でお皿に集まる
        });

        render = Render.create({
            element: wrapper,
            engine: engine,
            options: {
                width: CANVAS_SIZE,
                height: CANVAS_SIZE,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        runner = Runner.create();
        Runner.run(runner, engine);

        createBowlBoundary();
        createSpoon();
        setupInputHandlers();

        // 描画ループカスタム（スプーンと軌跡）
        Events.on(render, 'afterRender', drawCustomOverlay);
    }

    // 器（すり鉢状の円形バウンダリ）を作成
    function createBowlBoundary() {
        const numSegments = 32;
        const thickness = 40;
        for (let i = 0; i < numSegments; i++) {
            const angle = (i / numSegments) * Math.PI * 2;
            const x = RADIUS + (RADIUS + thickness / 2 - 5) * Math.cos(angle);
            const y = RADIUS + (RADIUS + thickness / 2 - 5) * Math.sin(angle);
            const wall = Bodies.rectangle(x, y, 40, thickness, {
                isStatic: true,
                angle: angle + Math.PI / 2,
                render: { visible: false }
            });
            Composite.add(engine.world, wall);
        }
    }

    // スプーン（物理体）の生成
    function createSpoon() {
        spoonBody = Bodies.circle(-100, -100, SPOON_RADIUS, {
            isSensor: true, // デフォルト（タップ時）は物理すり抜け
            render: { visible: false }
        });
        Composite.add(engine.world, spoonBody);
    }

    // 具材の生成
    function spawnItems(countKanten = 18, countMame = 8, countGyuhyu = 0) {
        for (let i = 0; i < countKanten; i++) createItem('kanten');
        for (let i = 0; i < countMame; i++) createItem('mame');
        for (let i = 0; i < countGyuhyu; i++) createItem('gyuhyu');
    }

    function createItem(type) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * (RADIUS - 60);
        const x = RADIUS + r * Math.cos(angle);
        const y = RADIUS + r * Math.sin(angle) - 40;

        let body;
        if (type === 'kanten') {
            // 寒天 (四角)
            const size = 22 + Math.random() * 4;
            body = Bodies.rectangle(x, y, size, size, {
                restitution: 0.2,
                friction: 0.05,
                density: 0.002,
                render: {
                    fillStyle: 'rgba(224, 242, 254, 0.85)',
                    strokeStyle: '#bae6fd',
                    lineWidth: 2
                }
            });
            body.itemType = 'kanten';
        } else if (type === 'mame') {
            // 謎の豆 (黒丸)
            const radius = 10 + Math.random() * 2;
            body = Bodies.circle(x, y, radius, {
                restitution: 0.4,
                friction: 0.02,
                density: 0.003,
                render: {
                    fillStyle: '#292524',
                    strokeStyle: '#44403c',
                    lineWidth: 2
                }
            });
            body.itemType = 'mame';
        } else if (type === 'gyuhyu') {
            // 求肥 (ピンク角丸)
            const size = 26;
            body = Bodies.rectangle(x, y, size, size, {
                restitution: 0.1,
                friction: 0.1,
                density: 0.001,
                render: {
                    fillStyle: '#fbcfe8',
                    strokeStyle: '#f472b6',
                    lineWidth: 3
                }
            });
            body.itemType = 'gyuhyu';
        }

        items.push(body);
        Composite.add(engine.world, body);
    }

    // 入力イベント（タップ / スライド切り替え & リリース）
    function setupInputHandlers() {
        const canvas = render.canvas;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function onStart(e) {
            if (!isPlaying) return;
            isMouseDown = true;
            startPos = getPos(e);
            currentPos = { ...startPos };
            isSliding = false;

            // 最初はセンサー状態（弾かない）
            spoonBody.isSensor = true;
            Body.setPosition(spoonBody, currentPos);
        }

        function onMove(e) {
            if (!isMouseDown || !isPlaying) return;
            currentPos = getPos(e);

            const dx = currentPos.x - startPos.x;
            const dy = currentPos.y - startPos.y;
            const dist = Math.hypot(dx, dy);

            // 移動距離が12pxを超えたらスライドとみなす
            if (dist > 12) {
                isSliding = true;
                spoonBody.isSensor = false; // 物理コライダー化して具材を動かせる
            }

            Body.setPosition(spoonBody, currentPos);
        }

        function onEnd() {
            if (!isMouseDown || !isPlaying) return;
            isMouseDown = false;

            // 指を離したタイミングでスプーン内の具材を獲得！
            collectItemsAtSpoon(currentPos);

            // スプーンを退避
            Body.setPosition(spoonBody, { x: -100, y: -100 });
            spoonBody.isSensor = true;
            isSliding = false;
        }

        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', onStart, { passive: true });
        canvas.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
    }

    // 獲得判定（リリース時）
    function collectItemsAtSpoon(pos) {
        const collected = [];
        
        items.forEach(item => {
            const d = Vector.magnitude(Vector.sub(item.position, pos));
            if (d <= SPOON_RADIUS + 10) {
                collected.push(item);
            }
        });

        if (collected.length === 0) return;

        let deltaScore = 0;
        collected.forEach(item => {
            if (item.itemType === 'kanten') deltaScore += SCORE_KANTEN;
            else if (item.itemType === 'mame') deltaScore += SCORE_MAME;
            else if (item.itemType === 'gyuhyu') deltaScore += SCORE_GYUHYU;

            // 画面・物理世界から削除
            Composite.remove(engine.world, item);
            items = items.filter(i => i !== item);
        });

        score += deltaScore;
        scoreEl.textContent = score;

        // ポップアップ演出
        showFloatingScore(pos.x, pos.y, deltaScore);

        // 寒天が底をついたら補充
        const remainingKanten = items.filter(i => i.itemType === 'kanten').length;
        if (remainingKanten === 0) {
            spawnItems(12, 4, gyuhyuUnlocked ? 3 : 0);
        }
    }

    // 得点エフェクト表示
    function showFloatingScore(x, y, pts) {
        const el = document.createElement('div');
        el.className = 'score-float';
        el.style.left = `${x + wrapper.offsetLeft - 15}px`;
        el.style.top = `${y + wrapper.offsetTop - 10}px`;
        
        if (pts > 0) {
            el.textContent = `+${pts}`;
            el.style.color = '#16a34a';
        } else if (pts < 0) {
            el.textContent = `${pts}`;
            el.style.color = '#dc2626';
        } else {
            el.textContent = `±0`;
            el.style.color = '#6b7280';
        }

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
    }

    // カスタム描画（器の底、スプーンの見栄え）
    function drawCustomOverlay() {
        const ctx = render.context;

        // 器（ベース）の描画
        ctx.save();
        ctx.beginPath();
        ctx.arc(RADIUS, RADIUS, RADIUS - 8, 0, Math.PI * 2);
        ctx.fillStyle = '#fef3c7'; // 器の内側（薄い黄色）
        ctx.fill();
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#7c2d12'; // 漆器風のフチ
        ctx.stroke();

        // 蜜（中央にうっすら）
        ctx.beginPath();
        ctx.arc(RADIUS, RADIUS, RADIUS - 40, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(120, 53, 15, 0.08)';
        ctx.fill();
        ctx.restore();

        // スプーンの描画
        if (isMouseDown) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(currentPos.x, currentPos.y, SPOON_RADIUS, 0, Math.PI * 2);
            
            // スライド時は物理モード（枠線が強調）
            if (isSliding) {
                ctx.fillStyle = 'rgba(203, 213, 225, 0.4)';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 3;
            } else {
                ctx.fillStyle = 'rgba(254, 240, 138, 0.4)';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]); // タップ中は破線で静かさを表現
            }
            
            ctx.fill();
            ctx.stroke();

            // スプーンの柄
            ctx.beginPath();
            ctx.moveTo(currentPos.x, currentPos.y);
            ctx.lineTo(currentPos.x + 45, currentPos.y + 45);
            ctx.lineWidth = 8;
            ctx.strokeStyle = isSliding ? '#64748b' : '#a16207';
            ctx.stroke();

            ctx.restore();
        }
    }

    // ゲーム開始
    function startGame() {
        // クリーンアップ
        items.forEach(item => Composite.remove(engine.world, item));
        items = [];
        
        score = 0;
        timeLeft = 60;
        gyuhyuUnlocked = false;
        scoreEl.textContent = score;
        timerEl.textContent = timeLeft;
        timerEl.classList.remove('warning');

        startModal.classList.add('hidden');
        resultModal.classList.add('hidden');
        newRecordMsg.classList.add('hidden');

        spawnItems(20, 8, 0); // 初期配置
        isPlaying = true;

        // タイマー開始
        clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;

            if (timeLeft <= 10) {
                timerEl.classList.add('warning');
            }

            // 残り30秒で求肥（+2）解放
            if (timeLeft === 30 && !gyuhyuUnlocked) {
                gyuhyuUnlocked = true;
                spawnItems(0, 0, 4);
                showFloatingScore(RADIUS, RADIUS - 40, "求肥解禁! (+2)");
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // ゲーム終了・称号判定
    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);

        finalScoreEl.textContent = score;

        // ハイスコア更新
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('anmitsu_best', bestScore);
            bestScoreEl.textContent = bestScore;
            newRecordMsg.classList.remove('hidden');
        }

        // 称号の獲得 (更新された条件)
        let rank = '';
        if (score >= 200) {
            rank = '🏆 寒天神';
        } else if (score >= 150) {
            rank = '🥇 寒天マスター';
        } else if (score >= 100) {
            rank = '🥈 寒天の選別士';
        } else if (score >= 50) {
            rank = '🥉 あんみつ愛好家';
        } else if (score >= 0) {
            rank = '🫘 豆クラッシャー';
        } else {
            rank = '😭 ほぼ豆';
        }

        rankBadgeEl.textContent = `称号: ${rank}`;
        resultModal.classList.remove('hidden');
    }

    // かき混ぜボタン
    mixBtn.addEventListener('click', () => {
        if (!isPlaying) return;
        items.forEach(item => {
            const forceX = (Math.random() - 0.5) * 0.05;
            const forceY = (Math.random() - 0.5) * 0.05;
            Body.applyForce(item, item.position, { x: forceX, y: forceY });
        });
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // 起動時イニシャライズ
    window.addEventListener('load', initEngine);
})();
</script>
</body>
</html>
